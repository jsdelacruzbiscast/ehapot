<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eHapot · Moderator</title>
  <script src="config.js"></script>
  <style>
    :root{--navy:#0A2B4E;--blue:#1D5C9B;--gold:#D4A017;--lg:#F5C842;--bg:#F4F7FC;--white:#fff;--green:#2E7D32;--red:#C62828}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:#26364a}
    header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .brand{font-size:1.7rem;font-weight:800}.brand span{color:var(--gold)}
    .conn{font-size:.85rem}.conn b{color:var(--lg)}
    main{padding:20px;width:min(1500px,100%);margin:auto}
    .login{width:min(520px,100%);margin:40px auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(10,43,78,.15);border-top:6px solid var(--gold)}
    label{display:block;font-weight:750;color:var(--navy);margin:14px 0 7px}
    input{width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}
    input:focus-visible,button:focus-visible{outline:3px solid var(--lg);outline-offset:2px}
    button{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}
    .primary{background:var(--blue);color:#fff;width:100%;margin-top:18px;padding:13px}.primary:hover{background:var(--navy)}
    .error{color:var(--red);min-height:20px;margin-top:10px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
    .toolbar .info{font-weight:700;color:var(--navy)}
    .toolbar-actions{display:flex;gap:8px}
    .secondary{background:#fff;color:var(--navy);border:1px solid #cbd5e1}
    .dashboard{display:none}
    .columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .column{background:#fff;border-radius:20px;padding:16px;min-height:420px;box-shadow:0 10px 30px rgba(10,43,78,.08)}
    .column h2{margin:0 0 14px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;font-size:1.1rem}
    .count{background:var(--navy);color:#fff;border-radius:999px;padding:2px 9px;font-size:.78rem}
    .question-card{border:1px solid #dbe3ec;border-left:5px solid var(--blue);border-radius:13px;padding:12px;margin-bottom:10px}
    .question-card p{margin:0 0 8px;line-height:1.4;overflow-wrap:anywhere}
    .meta{font-size:.76rem;color:#6b7280;margin-bottom:9px}
    .actions{display:flex;gap:7px;flex-wrap:wrap}
    .approve{background:#eaf6ed;color:var(--green)}.reject{background:#fff0f0;color:var(--red)}
    .air{background:var(--gold);color:var(--navy)}.complete{background:var(--navy);color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    .empty{color:#98a2b3;text-align:center;padding:35px 6px}
    .side{display:flex;gap:10px;align-items:center}
    .audience-card{background:#fff;border-radius:18px;padding:14px 18px;margin-bottom:16px;
      box-shadow:0 6px 20px rgba(10,43,78,.06);border:1px solid #eef1f5}
    .audience-card-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .audience-card-label{font-weight:800;color:var(--navy);font-size:.95rem}
    .audience-card-hint{font-size:.78rem;color:#8a94a3}
    .audience-card-row{display:flex;gap:8px;flex-wrap:wrap}
    .audience-link-field{flex:1;min-width:220px;background:var(--bg);border:2px solid #e2e8f0;border-radius:11px;
      padding:11px 14px;font:inherit;font-size:.85rem;color:var(--navy);font-weight:600;cursor:text}
    .audience-link-field:focus-visible,.audience-link-field:focus{outline:3px solid var(--lg);outline-offset:2px;border-color:var(--blue)}
    .icon-btn{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--navy);
      border:1px solid #cbd5e1;border-radius:11px;padding:0 16px;font-weight:750;cursor:pointer;white-space:nowrap}
    .icon-btn:hover{background:#eef2f7}
    .icon-btn svg{width:16px;height:16px;flex:0 0 auto}
    .icon-btn.copied{background:#eaf6ed;color:var(--green);border-color:#bfe3c7}
    .hint{font-size:.8rem;color:#667085;margin-top:10px}
    .title-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:16px;
      padding:12px 16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(10,43,78,.06)}
    .title-bar label{margin:0;white-space:nowrap;font-weight:750;color:var(--navy)}
    .title-bar input{flex:1;min-width:220px;border:2px solid #cbd5e1;border-radius:11px;padding:9px 12px;font:inherit}
    #titleStatus{font-size:.8rem;min-width:76px}
    #titleStatus.success{color:var(--green)}
    #titleStatus.error{color:var(--red)}
    @media(max-width:950px){.columns{grid-template-columns:1fr}.side{display:none}}
  </style>
</head>
<body>
<header>
  <div class="brand">🎙️ <span>e</span>Hapot Moderator</div>
  <div class="conn">Status: <b id="connText">Locked</b></div>
</header>

<main>
  <section id="loginPanel" class="login">
    <h1>Unlock Moderator Dashboard</h1>
    <label for="name">Moderator name</label>
    <input id="name" maxlength="100" autocomplete="name">

    <label for="pin">Public event code</label>
    <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off">

    <label for="secret">Moderator secret</label>
    <input id="secret" type="password" autocomplete="off">
    <div class="hint">The moderator secret is separate from the public event code and is never placed in a QR code or URL.</div>

    <button id="loginBtn" class="primary" type="button">Unlock Dashboard</button>
    <div id="loginError" class="error" aria-live="polite"></div>
  </section>

  <section id="dashboard" class="dashboard">
    <div class="title-bar">
      <label for="eventTitleInput">🏷️ Event Title</label>
      <input id="eventTitleInput" type="text" maxlength="120"
             placeholder="Shown on the projector screen — e.g. BISCAST Freshman Orientation 2026">
      <button id="saveTitleBtn" class="secondary" type="button">Save</button>
      <span id="titleStatus" aria-live="polite"></span>
    </div>

    <div class="audience-card">
      <div class="audience-card-head">
        <span class="audience-card-label">🔗 Audience Entry Link</span>
        <span class="audience-card-hint">Share this so attendees can submit questions</span>
      </div>
      <div class="audience-card-row">
        <input id="audienceLink" class="audience-link-field" type="text" readonly
               aria-label="Audience entry URL — click to select, then copy">
        <button id="openAudienceBtn" class="icon-btn" type="button" title="Open in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <path d="M15 3h6v6"/>
            <path d="M10 14 21 3"/>
          </svg>
          <span>Open</span>
        </button>
        <button id="copyAudienceBtn" class="icon-btn" type="button" title="Copy link to clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copyBtnLabel">Copy Link</span>
        </button>
      </div>
    </div>

    <div class="toolbar">
      <div class="info"><span id="moderatorLabel"></span> · Event <span id="eventLabel"></span></div>
      <div class="side">
        <a id="sheetLink" class="secondary" style="text-decoration:none;padding:9px 12px;border-radius:11px;display:inline-block"
           target="_blank" rel="noopener noreferrer">📊 Audit Log</a>
      </div>
      <div class="toolbar-actions">
        <input id="searchBox" type="search" placeholder="Filter by text or name…" autocomplete="off"
               style="border:2px solid #cbd5e1;border-radius:11px;padding:9px 12px;font:inherit;min-width:220px">
        <button id="exportBtn" class="secondary" type="button">Export CSV</button>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
        <button id="logoutBtn" class="secondary" type="button">Lock</button>
      </div>
    </div>

    <div class="columns">
      <section class="column" aria-labelledby="pendingTitle">
        <h2 id="pendingTitle">Pending <span id="pendingCount" class="count">0</span></h2>
        <div id="pendingList"></div>
      </section>
      <section class="column" aria-labelledby="deckTitle">
        <h2 id="deckTitle">On Deck <span id="deckCount" class="count">0</span></h2>
        <div id="deckList"></div>
      </section>
      <section class="column" aria-labelledby="airTitle">
        <h2 id="airTitle">On Air <span id="airCount" class="count">0</span></h2>
        <div id="airList"></div>
      </section>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  if (typeof CONFIG === 'undefined') {
    document.body.innerHTML = '<main style="font-family:system-ui;padding:2rem"><h1>eHapot configuration error</h1><p>config.js could not be loaded.</p></main>';
    throw new Error('CONFIG is not defined');
  }

  const pinRegex = new RegExp(CONFIG.EVENT_PIN_PATTERN);
  const loginPanel = document.getElementById('loginPanel');
  const dashboard = document.getElementById('dashboard');
  const nameInput = document.getElementById('name');
  const pinInput = document.getElementById('pin');
  const secretInput = document.getElementById('secret');
  const loginError = document.getElementById('loginError');
  const connText = document.getElementById('connText');

  let moderatorName = '';
  let eventPin = '';
  let moderatorSecret = '';
  let timer = null;
  let pollGen = 0; // v2.4.0: guards against overlapping refresh cycles clobbering each other's timers
  let locked = true;
  let busy = false;
  let currentFeed = {pending:[], onDeck:[], onAir:null};
  let previousPendingCount = 0;
  let audioContext = null;
  let searchTerm = '';

  function matchesSearch(q) {
    if (!searchTerm) return true;
    const haystack = `${q.text || ''} ${q.submittedBy || ''}`.toLowerCase();
    return haystack.includes(searchTerm);
  }

  pinInput.value = new URLSearchParams(location.search).get('pin') || localStorage.getItem('eHapot_event_pin') || '';

  function setConnection(text) { connText.textContent = text; }

  async function post(payload) {
    const controller = new AbortController();
    const timeoutMs = CONFIG.MODERATOR_REQUEST_TIMEOUT || 45000;
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(CONFIG.ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body:JSON.stringify(payload),
        redirect:'follow',
        signal:controller.signal
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || data.ok !== true) throw new Error(data?.error || 'Backend request failed');
      return data;
    } catch (err) {
      if (err && err.name === 'AbortError') {
        throw new Error(`Moderator request timed out after ${Math.round(timeoutMs / 1000)} seconds. Please retry; if it repeats, verify the Apps Script deployment.`);
      }
      throw err;
    } finally {
      clearTimeout(timeout);
    }
  }

  function authPayload(action) {
    return {action, pin:eventPin, moderatorName, moderatorSecret};
  }

  function audienceUrl() {
    const url = new URL('submit.html', location.href);
    url.search = '';
    url.searchParams.set('pin', eventPin);
    return url.href;
  }

  function showAudienceLink() {
    const el = document.getElementById('audienceLink');
    el.value = audienceUrl();
  }

  const audienceLinkField = document.getElementById('audienceLink');
  audienceLinkField.addEventListener('focus', () => audienceLinkField.select());
  audienceLinkField.addEventListener('click', () => audienceLinkField.select());

  document.getElementById('openAudienceBtn').addEventListener('click', () => {
    window.open(audienceUrl(), '_blank', 'noopener');
  });

  document.getElementById('copyAudienceBtn').addEventListener('click', async () => {
    const btn = document.getElementById('copyAudienceBtn');
    const label = document.getElementById('copyBtnLabel');
    const url = audienceUrl();
    try {
      await navigator.clipboard.writeText(url);
    } catch (_) {
      // Clipboard API unavailable or blocked (e.g. non-HTTPS, permissions) —
      // fall back to a manual-copy prompt instead of failing silently.
      window.prompt('Copy this link:', url);
      return;
    }
    const original = label.textContent;
    label.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      label.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  });

  function showSheetLink() {
    // Only ever populated after a successful verifyModerator() call, so the
    // raw Sheet URL is never present in markup an unauthenticated visitor
    // could reach (unlike the old public launchpad card).
    const link = document.getElementById('sheetLink');
    if (CONFIG.SHEET_URL) link.href = CONFIG.SHEET_URL;
    else link.style.display = 'none';
  }

  // ------------------------------------------------------------------
  // Event title (v2.4.0): configured here, displayed on the projector.
  // Persisted server-side (per PIN) so it survives refreshes and is
  // visible to every moderator/projector for the event, not just this
  // browser tab.
  // ------------------------------------------------------------------
  const eventTitleInput = document.getElementById('eventTitleInput');
  const saveTitleBtn = document.getElementById('saveTitleBtn');
  const titleStatus = document.getElementById('titleStatus');

  function applyEventTitle(title) {
    if (typeof title !== 'string') return;
    if (document.activeElement === eventTitleInput) return; // don't clobber while the moderator is typing
    eventTitleInput.value = title;
  }

  async function saveEventTitle() {
    const title = eventTitleInput.value.trim().slice(0, 120);
    saveTitleBtn.disabled = true;
    const original = saveTitleBtn.textContent;
    saveTitleBtn.textContent = 'Saving…';
    titleStatus.textContent = '';
    titleStatus.className = '';
    try {
      const data = await post({...authPayload('setEventTitle'), title});
      eventTitleInput.value = typeof data.eventTitle === 'string' ? data.eventTitle : title;
      titleStatus.textContent = 'Saved ✓';
      titleStatus.className = 'success';
    } catch (err) {
      titleStatus.textContent = err.message || 'Could not save title.';
      titleStatus.className = 'error';
    } finally {
      saveTitleBtn.disabled = false;
      saveTitleBtn.textContent = original;
      setTimeout(() => { titleStatus.textContent = ''; titleStatus.className = ''; }, 4000);
    }
  }

  saveTitleBtn.addEventListener('click', saveEventTitle);
  eventTitleInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveEventTitle(); }
  });

  function playChime() {
    try {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0.04, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.18);
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.start(); osc.stop(audioContext.currentTime + 0.18);
    } catch (_) {}
  }

  function empty(container, message) {
    container.replaceChildren();
    const el = document.createElement('div');
    el.className = 'empty'; el.textContent = message; container.append(el);
  }

  function makeCard(q, buttons) {
    const card = document.createElement('article');
    card.className = 'question-card';

    const p = document.createElement('p');
    p.textContent = q.text || '';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${q.submittedBy || 'Anonymous'} · ${new Date(q.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;

    const actions = document.createElement('div');
    actions.className = 'actions';

    for (const spec of buttons) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = spec.className; b.textContent = spec.label;
      b.disabled = busy;
      b.addEventListener('click', () => spec.onClick(q));
      actions.append(b);
    }

    card.append(p,meta,actions);
    return card;
  }

  function renderFeed(feed) {
    currentFeed = feed;
    applyEventTitle(feed.eventTitle);
    const pending = Array.isArray(feed.pending) ? feed.pending : [];
    const deck = Array.isArray(feed.onDeck) ? feed.onDeck : [];
    const air = feed.onAir || null;

    // Counts reflect the true totals, not the filtered view, so moderators
    // always know the real queue size even while searching.
    document.getElementById('pendingCount').textContent = pending.length;
    document.getElementById('deckCount').textContent = deck.length;
    document.getElementById('airCount').textContent = air ? '1' : '0';

    const pBox = document.getElementById('pendingList');
    const dBox = document.getElementById('deckList');
    const aBox = document.getElementById('airList');

    pBox.replaceChildren();
    dBox.replaceChildren();
    aBox.replaceChildren();

    const visiblePending = pending.filter(matchesSearch);
    const visibleDeck = deck.filter(matchesSearch);

    if (!pending.length) empty(pBox,'No pending questions');
    else if (!visiblePending.length) empty(pBox,'No matches for this filter');
    else visiblePending.forEach(q => pBox.append(makeCard(q,[
      {label:'✅ Approve',className:'approve',onClick:()=>transition(q,'APPROVED')},
      {label:'❌ Reject',className:'reject',onClick:()=>reject(q)}
    ])));

    if (!deck.length) empty(dBox,'No approved questions');
    else if (!visibleDeck.length) empty(dBox,'No matches for this filter');
    else visibleDeck.forEach(q => dBox.append(makeCard(q,[
      {label:'📢 Send to Screen',className:'air',onClick:()=>transition(q,'ON_AIR')}
    ])));

    if (!air) empty(aBox,'No question is live');
    else aBox.append(makeCard(air,[
      {label:'✅ Answered & Close',className:'complete',onClick:()=>transition(air,'COMPLETED')}
    ]));

    if (pending.length > previousPendingCount && previousPendingCount >= 0) playChime();
    previousPendingCount = pending.length;
  }

  function scheduleRefresh(delay) {
    clearTimeout(timer);
    const myGen = pollGen;
    timer = setTimeout(() => {
      if (myGen === pollGen) refreshFeed();
    }, delay);
  }

  async function refreshFeed(scheduleNext = true) {
    if (locked) return;
    // Snapshot the generation before awaiting. If a newer cycle starts
    // (e.g. login, or another refreshFeed call bumps pollGen) while this
    // request is in flight, this response is stale and must not be allowed
    // to reschedule or clobber a timer a newer cycle already set up.
    const myGen = pollGen;
    try {
      const data = await post(authPayload('getModeratorFeed'));
      if (myGen !== pollGen) return;
      setConnection('Live');
      renderFeed(data);
    } catch (err) {
      if (myGen !== pollGen) return;
      console.error('[eHapot moderator]', err);
      setConnection(navigator.onLine ? 'Reconnecting…' : 'Offline');
    } finally {
      if (myGen === pollGen && !locked && scheduleNext) scheduleRefresh(CONFIG.MODERATOR_POLL_INTERVAL);
    }
  }

  async function transition(q, toState, reason='') {
    if (busy) return;
    busy = true;

    // Optimistic UI: pull the item out of view immediately so the column
    // change feels instant, instead of waiting on the network round trip.
    renderFeed({
      pending: currentFeed.pending.filter(x => x.id !== q.id),
      onDeck: currentFeed.onDeck.filter(x => x.id !== q.id),
      onAir: currentFeed.onAir && currentFeed.onAir.id === q.id ? null : currentFeed.onAir,
      recentCompleted: currentFeed.recentCompleted
    });

    try {
      // v2.3.0: the backend now returns the fresh feed in this same
      // response, so there's no second request needed to re-sync.
      const data = await post({...authPayload('transitionQuestion'), questionId:q.id, toState, reason});
      renderFeed(data.feed);
    } catch (err) {
      alert(err.message);
      // The optimistic view may now be wrong (item removed but the
      // transition didn't actually happen) — resync with the server.
      await refreshFeed(false);
    } finally {
      busy = false;
      // v2.4.0: bump the generation so any auto-poll that was in flight
      // during this transition can't win a race and clobber the timer
      // we're about to set here.
      pollGen++;
      if (!locked) scheduleRefresh(CONFIG.MODERATOR_POLL_INTERVAL);
    }
  }

  function reject(q) {
    const reason = prompt('Rejection reason (optional):','') ?? null;
    if (reason === null) return;
    transition(q,'REJECTED',reason.trim());
  }

  async function login() {
    loginError.textContent = '';
    moderatorName = nameInput.value.trim();
    eventPin = pinInput.value.trim();
    moderatorSecret = secretInput.value;

    if (moderatorName.length < 2) { loginError.textContent = 'Enter the moderator name.'; return; }
    if (!pinRegex.test(eventPin)) { loginError.textContent = 'Enter a valid 4–6 digit event code.'; return; }
    if (!moderatorSecret) { loginError.textContent = 'Enter the moderator secret.'; return; }

    document.getElementById('loginBtn').disabled = true;
    setConnection('Authenticating…');

    try {
      await post(authPayload('verifyModerator'));
      locked = false;
      localStorage.setItem('eHapot_event_pin', eventPin);
      loginPanel.style.display = 'none';
      dashboard.style.display = 'block';
      document.getElementById('moderatorLabel').textContent = moderatorName;
      document.getElementById('eventLabel').textContent = eventPin;
      secretInput.value = '';
      previousPendingCount = -1;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
      } catch (_) {}
      showAudienceLink();
      showSheetLink();
      pollGen++;
      await refreshFeed();
    } catch (err) {
      moderatorSecret = '';
      loginError.textContent = err.message || 'Unable to reach the eHapot backend.';
      setConnection('Locked');
    } finally {
      document.getElementById('loginBtn').disabled = false;
    }
  }

  async function exportCsv() {
    const btn = document.getElementById('exportBtn');
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Exporting…';
    try {
      const data = await post(authPayload('exportEventCsv'));
      const blob = new Blob([data.csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `eHapot_${eventPin}_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  function logout() {
    locked = true;
    pollGen++;
    clearTimeout(timer);
    moderatorSecret = '';
    currentFeed = {pending:[],onDeck:[],onAir:null};
    dashboard.style.display = 'none';
    loginPanel.style.display = 'block';
    setConnection('Locked');
    document.getElementById('sheetLink').removeAttribute('href');
    document.getElementById('audienceLink').value = '';
    eventTitleInput.value = '';
    secretInput.value = '';
    searchTerm = '';
    document.getElementById('searchBox').value = '';
    secretInput.focus();
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  secretInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('refreshBtn').addEventListener('click', () => refreshFeed(false));
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('searchBox').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderFeed(currentFeed);
  });
  window.addEventListener('offline', () => setConnection('Offline'));
  window.addEventListener('online', () => { if (!locked) refreshFeed(false); });

  document.addEventListener('keydown', e => {
    if (locked || !(e.ctrlKey || e.metaKey)) return;
    if (e.key === 'ArrowUp' && currentFeed.pending?.[0]) {
      e.preventDefault(); transition(currentFeed.pending[0],'APPROVED');
    } else if (e.key === 'ArrowRight' && currentFeed.onDeck?.[0]) {
      e.preventDefault(); transition(currentFeed.onDeck[0],'ON_AIR');
    } else if (e.key === 'ArrowDown' && currentFeed.onAir) {
      e.preventDefault(); transition(currentFeed.onAir,'COMPLETED');
    }
  });
})();
</script>
</body>
</html>
