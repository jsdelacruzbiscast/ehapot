<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eHapot · Moderator</title>
  <script src="config.js"></script>
  <style>
    :root{--navy:#0A2B4E;--blue:#1D5C9B;--gold:#D4A017;--lg:#F5C842;--bg:#F4F7FC;--white:#fff;--green:#2E7D32;--red:#C62828}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:#26364a}
    header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .brand{font-size:1.7rem;font-weight:800}.brand span{color:var(--gold)}
    .conn{font-size:.85rem}.conn b{color:var(--lg)}
    main{padding:20px;width:min(1500px,100%);margin:auto}
    .login{width:min(520px,100%);margin:40px auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(10,43,78,.15);border-top:6px solid var(--gold)}
    label{display:block;font-weight:750;color:var(--navy);margin:14px 0 7px}
    input{width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}
    input:focus-visible,button:focus-visible{outline:3px solid var(--lg);outline-offset:2px}
    button{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}
    .primary{background:var(--blue);color:#fff;width:100%;margin-top:18px;padding:13px}.primary:hover{background:var(--navy)}
    .error{color:var(--red);min-height:20px;margin-top:10px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
    .toolbar .info{font-weight:700;color:var(--navy)}
    .toolbar-actions{display:flex;gap:8px}
    .secondary{background:#fff;color:var(--navy);border:1px solid #cbd5e1}
    .dashboard{display:none}
    .columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .column{background:#fff;border-radius:20px;padding:16px;min-height:420px;box-shadow:0 10px 30px rgba(10,43,78,.08)}
    .column h2{margin:0 0 14px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;font-size:1.1rem}
    .count{background:var(--navy);color:#fff;border-radius:999px;padding:2px 9px;font-size:.78rem}
    .question-card{border:1px solid #dbe3ec;border-left:5px solid var(--blue);border-radius:13px;padding:12px;margin-bottom:10px}
    .question-card p{margin:0 0 8px;line-height:1.4;overflow-wrap:anywhere}
    .meta{font-size:.76rem;color:#6b7280;margin-bottom:9px}
    .actions{display:flex;gap:7px;flex-wrap:wrap}
    .approve{background:#eaf6ed;color:var(--green)}.reject{background:#fff0f0;color:var(--red)}
    .air{background:var(--gold);color:var(--navy)}.complete{background:var(--navy);color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    .empty{color:#98a2b3;text-align:center;padding:35px 6px}
    .side{display:flex;gap:14px;align-items:center}.audience-link{background:#fff;padding:10px 12px;border-radius:12px;font-size:.78rem;max-width:260px;overflow-wrap:anywhere}
    .hint{font-size:.8rem;color:#667085;margin-top:10px}
    @media(max-width:950px){.columns{grid-template-columns:1fr}.side{display:none}}
  </style>
</head>
<body>
<header>
  <div class="brand">🎙️ <span>e</span>Hapot Moderator</div>
  <div class="conn">Status: <b id="connText">Locked</b></div>
</header>

<main>
  <section id="loginPanel" class="login">
    <h1>Unlock Moderator Dashboard</h1>
    <label for="name">Moderator name</label>
    <input id="name" maxlength="100" autocomplete="name">

    <label for="pin">Public event code</label>
    <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off">

    <label for="secret">Moderator secret</label>
    <input id="secret" type="password" autocomplete="off">
    <div class="hint">The moderator secret is separate from the public event code and is never placed in a QR code or URL.</div>

    <button id="loginBtn" class="primary" type="button">Unlock Dashboard</button>
    <div id="loginError" class="error" aria-live="polite"></div>
  </section>

  <section id="dashboard" class="dashboard">
    <div class="toolbar">
      <div class="info"><span id="moderatorLabel"></span> · Event <span id="eventLabel"></span></div>
      <div class="side">
        <div id="audienceLink" class="audience-link" aria-label="Audience entry URL"></div>
      </div>
      <div class="toolbar-actions">
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
        <button id="logoutBtn" class="secondary" type="button">Lock</button>
      </div>
    </div>

    <div class="columns">
      <section class="column" aria-labelledby="pendingTitle">
        <h2 id="pendingTitle">Pending <span id="pendingCount" class="count">0</span></h2>
        <div id="pendingList"></div>
      </section>
      <section class="column" aria-labelledby="deckTitle">
        <h2 id="deckTitle">On Deck <span id="deckCount" class="count">0</span></h2>
        <div id="deckList"></div>
      </section>
      <section class="column" aria-labelledby="airTitle">
        <h2 id="airTitle">On Air <span id="airCount" class="count">0</span></h2>
        <div id="airList"></div>
      </section>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  if (typeof CONFIG === 'undefined') {
    document.body.innerHTML = '<main style="font-family:system-ui;padding:2rem"><h1>eHapot configuration error</h1><p>config.js could not be loaded.</p></main>';
    throw new Error('CONFIG is not defined');
  }

  const pinRegex = new RegExp(CONFIG.EVENT_PIN_PATTERN);
  const loginPanel = document.getElementById('loginPanel');
  const dashboard = document.getElementById('dashboard');
  const nameInput = document.getElementById('name');
  const pinInput = document.getElementById('pin');
  const secretInput = document.getElementById('secret');
  const loginError = document.getElementById('loginError');
  const connText = document.getElementById('connText');

  let moderatorName = '';
  let eventPin = '';
  let moderatorSecret = '';
  let timer = null;
  let locked = true;
  let busy = false;
  let currentFeed = {pending:[], onDeck:[], onAir:null};
  let previousPendingCount = 0;
  let audioContext = null;

  pinInput.value = new URLSearchParams(location.search).get('pin') || localStorage.getItem('eHapot_event_pin') || '';

  function setConnection(text) { connText.textContent = text; }

  async function post(payload) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT);
    try {
      const res = await fetch(CONFIG.ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body:JSON.stringify(payload),
        redirect:'follow',
        signal:controller.signal
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || data.ok !== true) throw new Error(data?.error || 'Backend request failed');
      return data;
    } finally { clearTimeout(timeout); }
  }

  function authPayload(action) {
    return {action, pin:eventPin, moderatorName, moderatorSecret};
  }

  function audienceUrl() {
    const url = new URL('submit.html', location.href);
    url.search = '';
    url.searchParams.set('pin', eventPin);
    return url.href;
  }

  function showAudienceLink() {
    document.getElementById('audienceLink').textContent = audienceUrl();
  }

  function playChime() {
    try {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0.04, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.18);
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.start(); osc.stop(audioContext.currentTime + 0.18);
    } catch (_) {}
  }

  function empty(container, message) {
    container.replaceChildren();
    const el = document.createElement('div');
    el.className = 'empty'; el.textContent = message; container.append(el);
  }

  function makeCard(q, buttons) {
    const card = document.createElement('article');
    card.className = 'question-card';

    const p = document.createElement('p');
    p.textContent = q.text || '';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${q.submittedBy || 'Anonymous'} · ${new Date(q.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;

    const actions = document.createElement('div');
    actions.className = 'actions';

    for (const spec of buttons) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = spec.className; b.textContent = spec.label;
      b.disabled = busy;
      b.addEventListener('click', () => spec.onClick(q));
      actions.append(b);
    }

    card.append(p,meta,actions);
    return card;
  }

  function renderFeed(feed) {
    currentFeed = feed;
    const pending = Array.isArray(feed.pending) ? feed.pending : [];
    const deck = Array.isArray(feed.onDeck) ? feed.onDeck : [];
    const air = feed.onAir || null;

    document.getElementById('pendingCount').textContent = pending.length;
    document.getElementById('deckCount').textContent = deck.length;
    document.getElementById('airCount').textContent = air ? '1' : '0';

    const pBox = document.getElementById('pendingList');
    const dBox = document.getElementById('deckList');
    const aBox = document.getElementById('airList');

    pBox.replaceChildren();
    dBox.replaceChildren();
    aBox.replaceChildren();

    if (!pending.length) empty(pBox,'No pending questions');
    else pending.forEach(q => pBox.append(makeCard(q,[
      {label:'✅ Approve',className:'approve',onClick:()=>transition(q,'APPROVED')},
      {label:'❌ Reject',className:'reject',onClick:()=>reject(q)}
    ])));

    if (!deck.length) empty(dBox,'No approved questions');
    else deck.forEach(q => dBox.append(makeCard(q,[
      {label:'📢 Send to Screen',className:'air',onClick:()=>transition(q,'ON_AIR')}
    ])));

    if (!air) empty(aBox,'No question is live');
    else aBox.append(makeCard(air,[
      {label:'✅ Answered & Close',className:'complete',onClick:()=>transition(air,'COMPLETED')}
    ]));

    if (pending.length > previousPendingCount && previousPendingCount >= 0) playChime();
    previousPendingCount = pending.length;
  }

  async function refreshFeed(scheduleNext = true) {
    if (locked) return;
    try {
      const data = await post(authPayload('getModeratorFeed'));
      setConnection('Live');
      renderFeed(data);
    } catch (err) {
      console.error('[eHapot moderator]', err);
      setConnection(navigator.onLine ? 'Reconnecting…' : 'Offline');
    } finally {
      clearTimeout(timer);
      if (!locked && scheduleNext) timer = setTimeout(refreshFeed, CONFIG.MODERATOR_POLL_INTERVAL);
    }
  }

  async function transition(q, toState, reason='') {
    if (busy) return;
    busy = true;
    renderFeed(currentFeed);
    try {
      await post({...authPayload('transitionQuestion'), questionId:q.id, toState, reason});
      await refreshFeed(false);
    } catch (err) {
      alert(err.message);
    } finally {
      busy = false;
      renderFeed(currentFeed);
      clearTimeout(timer);
      if (!locked) timer = setTimeout(refreshFeed, CONFIG.MODERATOR_POLL_INTERVAL);
    }
  }

  function reject(q) {
    const reason = prompt('Rejection reason (optional):','') ?? null;
    if (reason === null) return;
    transition(q,'REJECTED',reason.trim());
  }

  async function login() {
    loginError.textContent = '';
    moderatorName = nameInput.value.trim();
    eventPin = pinInput.value.trim();
    moderatorSecret = secretInput.value;

    if (moderatorName.length < 2) { loginError.textContent = 'Enter the moderator name.'; return; }
    if (!pinRegex.test(eventPin)) { loginError.textContent = 'Enter a valid 4–6 digit event code.'; return; }
    if (!moderatorSecret) { loginError.textContent = 'Enter the moderator secret.'; return; }

    document.getElementById('loginBtn').disabled = true;
    setConnection('Authenticating…');

    try {
      await post(authPayload('verifyModerator'));
      locked = false;
      localStorage.setItem('eHapot_event_pin', eventPin);
      loginPanel.style.display = 'none';
      dashboard.style.display = 'block';
      document.getElementById('moderatorLabel').textContent = moderatorName;
      document.getElementById('eventLabel').textContent = eventPin;
      secretInput.value = '';
      previousPendingCount = -1;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
      } catch (_) {}
      showAudienceLink();
      await refreshFeed();
    } catch (err) {
      moderatorSecret = '';
      loginError.textContent = err.message;
      setConnection('Locked');
    } finally {
      document.getElementById('loginBtn').disabled = false;
    }
  }

  function logout() {
    locked = true;
    clearTimeout(timer);
    moderatorSecret = '';
    currentFeed = {pending:[],onDeck:[],onAir:null};
    dashboard.style.display = 'none';
    loginPanel.style.display = 'block';
    setConnection('Locked');
    secretInput.value = '';
    secretInput.focus();
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  secretInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('refreshBtn').addEventListener('click', () => refreshFeed(false));
  document.getElementById('logoutBtn').addEventListener('click', logout);
  window.addEventListener('offline', () => setConnection('Offline'));
  window.addEventListener('online', () => { if (!locked) refreshFeed(false); });

  document.addEventListener('keydown', e => {
    if (locked || !(e.ctrlKey || e.metaKey)) return;
    if (e.key === 'ArrowUp' && currentFeed.pending?.[0]) {
      e.preventDefault(); transition(currentFeed.pending[0],'APPROVED');
    } else if (e.key === 'ArrowRight' && currentFeed.onDeck?.[0]) {
      e.preventDefault(); transition(currentFeed.onDeck[0],'ON_AIR');
    } else if (e.key === 'ArrowDown' && currentFeed.onAir) {
      e.preventDefault(); transition(currentFeed.onAir,'COMPLETED');
    }
  });
})();
</script>
</body>
</html>
